# NEON//WIRE ARCHIVE NODE CONFIGURATION
# Revision 4.2

[archive]
node_name=NW-042
archive_directory=backups/
retention_days=30

[recovery]
enabled=true
recovery_records=enabled
recovery_file_format=recovery_<year>_<month>.rec

[security]
authentication_logs=enabled
session_diagnostics=enabled

[notes]
Routine operational records are stored in the standard archive.

Emergency recovery records are maintained separately from
routine archive data.

Recovery records are generated monthly using the file format
specified above.